name: build-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 说明：Linux x86_64（凝思/Debian10，glibc 2.28 基线）绿色包由 GitLab CI 构建，
# 本工作流只负责 Windows 绿色包（GitLab 侧暂无 Windows runner）。
jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build requirements
        run: python -m pip install --no-cache-dir -r packaging/requirements-build.txt
      - name: Self test
        run: python packaging/selftest.py
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name CryptoAnalysisTool
          --distpath dist --workpath build --specpath build
          --collect-submodules scapy
          --exclude-module matplotlib --exclude-module numpy --exclude-module PIL
          --exclude-module tkinter --exclude-module _tkinter
          main.py
      - name: Smoke run (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\CryptoAnalysisTool\CryptoAnalysisTool.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "SMOKE_FAIL: app exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "SMOKE_OK"
      - name: Package zip
        run: Compress-Archive -Path dist/CryptoAnalysisTool -DestinationPath CryptoAnalysisTool-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-win-x64
          path: CryptoAnalysisTool-win-x64.zip
          retention-days: 90
          compression-level: 0
