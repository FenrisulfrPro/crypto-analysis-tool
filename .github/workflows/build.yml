name: build-packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux x86_64 绿色包：使用与目标机一致的 Debian 10 (buster, glibc 2.28) 构建环境，
  # 构建/门禁/冒烟逻辑复用 packaging/ci_linux_build.sh（与 GitLab CI 同一套）。
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian 10 (buster, glibc 2.28) container
        run: |
          docker run --rm -e PYSTD_PREFER_GITHUB=1 -v "$PWD:/work" -w /work debian:buster bash -c '
            set -e
            printf "deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq --no-install-recommends \
              python3 binutils ca-certificates xvfb \
              libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 \
              libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxcb1 \
              libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
              libgssapi-krb5-2 libssl1.1 \
              libdbus-1-3 libfontconfig1
            bash packaging/ci_linux_build.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-linux-x86_64
          path: CryptoAnalysisTool-linux-x86_64.tar.gz
          retention-days: 90
          compression-level: 0

  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build requirements
        run: python -m pip install --no-cache-dir -r packaging/requirements-build.txt
      - name: Self test
        run: python packaging/selftest.py
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name CryptoAnalysisTool
          --distpath dist --workpath build --specpath build
          --collect-submodules scapy
          --exclude-module matplotlib --exclude-module numpy --exclude-module PIL
          --exclude-module tkinter --exclude-module _tkinter
          main.py
      - name: Smoke run (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\CryptoAnalysisTool\CryptoAnalysisTool.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "SMOKE_FAIL: app exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "SMOKE_OK"
      - name: Package zip
        run: Compress-Archive -Path dist/CryptoAnalysisTool -DestinationPath CryptoAnalysisTool-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-win-x64
          path: CryptoAnalysisTool-win-x64.zip
          retention-days: 90
          compression-level: 0

  # 两个平台构建成功后发布到 GitHub Release，方便直接下载：
  #   - 推送到 main：更新滚动发布 latest-build（资源覆盖，永远是最新构建）
  #   - 推送 v* 标签：发布对应版本
  release:
    needs: [linux-x86_64, windows-x64]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ls -lh release-assets
          NOTES=$(printf '自动构建产物\n\n- 提交：%s\n- 运行：#%s\n- Linux x86_64：Debian 10 / glibc 2.28 / X11，自包含绿色包\n- Windows x64：免安装绿色包\n' "${SHA:0:7}" "${RUN_NUMBER}")
          if [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --title "CryptoAnalysisTool ${TAG}" --notes "$NOTES"
            gh release edit "$TAG" --title "CryptoAnalysisTool ${TAG}" --notes "$NOTES"
          else
            TAG="latest-build"
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --title "最新构建（latest-build）" --notes "$NOTES" --target "$SHA"
            gh release edit "$TAG" --title "最新构建（latest-build）" --notes "$NOTES"
          fi
          gh release upload "$TAG" release-assets/* --clobber
