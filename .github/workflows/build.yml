name: build-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (glibc 2.28 baseline, manylinux_2_28 / Python 3.11)
        run: |
          docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            PY=/opt/python/cp311-cp311/bin/python
            export PYTHONIOENCODING=utf-8
            $PY -m pip install --no-cache-dir -r packaging/requirements-build.txt
            SELFTEST_SKIP_GUI=1 $PY packaging/selftest.py
            $PY -m PyInstaller --noconfirm --clean --windowed --name CryptoAnalysisTool \
              --distpath dist --workpath build --specpath build \
              --collect-submodules scapy \
              --exclude-module matplotlib --exclude-module numpy --exclude-module PIL \
              --exclude-module tkinter --exclude-module _tkinter \
              main.py
            tar -czf CryptoAnalysisTool-linux-x86_64.tar.gz -C dist CryptoAnalysisTool
            chmod -R a+rX dist CryptoAnalysisTool-linux-x86_64.tar.gz
          '
      - name: Smoke run (Debian 12 + offscreen)
        run: |
          docker run --rm -v "$PWD:/work" debian:12 bash -c '
            set -e
            apt-get update -qq >/dev/null
            apt-get install -y -qq libglib2.0-0 libfontconfig1 libfreetype6 \
              libdbus-1-3 libxkbcommon0 libgl1 libegl1 >/dev/null
            chmod +x /work/dist/CryptoAnalysisTool/CryptoAnalysisTool
            QT_QPA_PLATFORM=offscreen /work/dist/CryptoAnalysisTool/CryptoAnalysisTool >/tmp/app.log 2>&1 &
            APP=$!
            sleep 15
            if kill -0 $APP 2>/dev/null; then
              kill $APP
              echo SMOKE_OK
            else
              echo SMOKE_FAIL
              tail -n 50 /tmp/app.log
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-linux-x86_64
          path: CryptoAnalysisTool-linux-x86_64.tar.gz
          retention-days: 90
          compression-level: 0

  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build requirements
        run: python -m pip install --no-cache-dir -r packaging/requirements-build.txt
      - name: Self test
        run: python packaging/selftest.py
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name CryptoAnalysisTool
          --distpath dist --workpath build --specpath build
          --collect-submodules scapy
          --exclude-module matplotlib --exclude-module numpy --exclude-module PIL
          --exclude-module tkinter --exclude-module _tkinter
          main.py
      - name: Smoke run (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\CryptoAnalysisTool\CryptoAnalysisTool.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "SMOKE_FAIL: app exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "SMOKE_OK"
      - name: Package zip
        run: Compress-Archive -Path dist/CryptoAnalysisTool -DestinationPath CryptoAnalysisTool-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-win-x64
          path: CryptoAnalysisTool-win-x64.zip
          retention-days: 90
          compression-level: 0
