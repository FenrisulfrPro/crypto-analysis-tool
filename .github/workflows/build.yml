name: build-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux x86_64 绿色包：使用与目标机一致的 Debian 10 (buster, glibc 2.28) 构建环境，
  # 构建/门禁/冒烟逻辑复用 packaging/ci_linux_build.sh（与 GitLab CI 同一套）。
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian 10 (buster, glibc 2.28) container
        run: |
          docker run --rm -e PYSTD_PREFER_GITHUB=1 -v "$PWD:/work" -w /work debian:buster bash -c '
            set -e
            printf "deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq --no-install-recommends \
              binutils ca-certificates xvfb \
              libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 \
              libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxcb1 libdbus-1-3 libfontconfig1
            bash packaging/ci_linux_build.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-linux-x86_64
          path: CryptoAnalysisTool-linux-x86_64.tar.gz
          retention-days: 90
          compression-level: 0

  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build requirements
        run: python -m pip install --no-cache-dir -r packaging/requirements-build.txt
      - name: Self test
        run: python packaging/selftest.py
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name CryptoAnalysisTool
          --distpath dist --workpath build --specpath build
          --collect-submodules scapy
          --exclude-module matplotlib --exclude-module numpy --exclude-module PIL
          --exclude-module tkinter --exclude-module _tkinter
          main.py
      - name: Smoke run (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\CryptoAnalysisTool\CryptoAnalysisTool.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "SMOKE_FAIL: app exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "SMOKE_OK"
      - name: Package zip
        run: Compress-Archive -Path dist/CryptoAnalysisTool -DestinationPath CryptoAnalysisTool-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalysisTool-win-x64
          path: CryptoAnalysisTool-win-x64.zip
          retention-days: 90
          compression-level: 0
